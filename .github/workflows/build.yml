name: Build website

on:
  push:
    branches: [main, site/rebuild]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check:templates
      - run: npm run build
      - run: npm run check:build
